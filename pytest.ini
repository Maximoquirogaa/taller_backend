[pytest]
testpaths = test
# `auto`: los tests y fixtures `async def` se ejecutan sin decorador explícito.
asyncio_mode = auto
# Un único bucle por sesión: el motor asyncpg vive lo mismo que la suite (D9).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -ra
